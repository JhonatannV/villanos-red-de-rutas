server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8085/realms/rutas-realm/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

services:
  grafo-service:
    url: ${GRAFO_SERVICE_URL:http://localhost:8081}
    timeout-ms: 5000
  ruta-service:
    url: ${RUTA_SERVICE_URL:http://localhost:8082}
    timeout-ms: 2000
