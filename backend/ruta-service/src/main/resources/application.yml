server:
  port: 8082

spring:
  application:
    name: ruta-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8085/realms/rutas-realm/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  algorithm:
    mode: ${ALGORITHM_MODE:native}

services:
  grafo-service:
    url: ${GRAFO_SERVICE_URL:http://localhost:8081}
