services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HTTP_ENABLED=true
    volumes:
      - ./keycloak/rutas-realm.json:/opt/keycloak/data/import/rutas-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8085:8080"
    networks:
      - red-de-rutas-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # La imagen de Keycloak no incluye curl ni wget: se consulta /health/ready con /dev/tcp de bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 2s   # mientras arranca se revisa cada 2 s (SCRUM-39)
    restart: unless-stopped

  grafo-service:
    build:
      context: ./backend/grafo-service
      dockerfile: Dockerfile
    image: villanos/grafo-service:latest
    container_name: grafo-service
    ports:
      - "8081:8081"
    environment:
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/rutas-realm/protocol/openid-connect/certs
    # SCRUM-39: se espera a que el servicio inicie, no a que este sano. Las claves
    # de Keycloak se piden con el primer token y el gateway responde 503 mientras
    # un servicio no conteste (W-RQ-01); asi todo arranca en paralelo (< 90 s).
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - red-de-rutas-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s   # mientras arranca se revisa cada 2 s (SCRUM-39)
    restart: unless-stopped

  ruta-service:
    build:
      context: ./backend/ruta-service
      dockerfile: Dockerfile
    image: villanos/ruta-service:latest
    container_name: ruta-service
    ports:
      - "8082:8082"
    environment:
      - GRAFO_SERVICE_URL=http://grafo-service:8081
      # native (C por JNA) o java; se puede cambiar al levantar: ALGORITHM_MODE=java docker compose up -d
      - ALGORITHM_MODE=${ALGORITHM_MODE:-native}
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/rutas-realm/protocol/openid-connect/certs
    # Arranque en paralelo (SCRUM-39): ver el comentario en grafo-service.
    depends_on:
      keycloak:
        condition: service_started
      grafo-service:
        condition: service_started
    networks:
      - red-de-rutas-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s   # mientras arranca se revisa cada 2 s (SCRUM-39)
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: villanos/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - GRAFO_SERVICE_URL=http://grafo-service:8081
      - RUTA_SERVICE_URL=http://ruta-service:8082
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/rutas-realm/protocol/openid-connect/certs
    # Arranque en paralelo (SCRUM-39): ver el comentario en grafo-service.
    depends_on:
      keycloak:
        condition: service_started
      grafo-service:
        condition: service_started
      ruta-service:
        condition: service_started
    networks:
      - red-de-rutas-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s   # mientras arranca se revisa cada 2 s (SCRUM-39)
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/red-rutas-web
      dockerfile: Dockerfile
    image: villanos/frontend:latest
    container_name: frontend
    ports:
      - "4200:80"
    # Arranque en paralelo (SCRUM-39): ver el comentario en grafo-service.
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - red-de-rutas-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s   # mientras arranca se revisa cada 2 s (SCRUM-39)
    restart: unless-stopped

networks:
  red-de-rutas-net:
    name: red-de-rutas-net
    driver: bridge
