services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HTTP_ENABLED=true
    volumes:
      - ./keycloak/rutas-realm.json:/opt/keycloak/data/import/rutas-realm.json:ro
    ports:
      - "8085:8080"
    networks:
      - red-de-rutas-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  grafo-service:
    build:
      context: ./backend/grafo-service
      dockerfile: Dockerfile
    image: villanos/grafo-service:latest
    container_name: grafo-service
    ports:
      - "8081:8081"
    environment:
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/rutas-realm/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - red-de-rutas-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ruta-service:
    build:
      context: ./backend/ruta-service
      dockerfile: Dockerfile
    image: villanos/ruta-service:latest
    container_name: ruta-service
    ports:
      - "8082:8082"
    environment:
      - GRAFO_SERVICE_URL=http://grafo-service:8081
      - ALGORITHM_MODE=native
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/rutas-realm/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
      grafo-service:
        condition: service_healthy
    networks:
      - red-de-rutas-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: villanos/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - GRAFO_SERVICE_URL=http://grafo-service:8081
      - RUTA_SERVICE_URL=http://ruta-service:8082
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/rutas-realm/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
      grafo-service:
        condition: service_healthy
      ruta-service:
        condition: service_healthy
    networks:
      - red-de-rutas-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  red-de-rutas-net:
    name: red-de-rutas-net
    driver: bridge
