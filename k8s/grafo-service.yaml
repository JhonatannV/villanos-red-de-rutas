apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafo-service
  namespace: red-de-rutas
  labels:
    app: grafo-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafo-service
  template:
    metadata:
      labels:
        app: grafo-service
    spec:
      containers:
        - name: grafo-service
          image: villanos/grafo-service:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: KEYCLOAK_JWKS_URI
              value: "http://keycloak.red-de-rutas.svc.cluster.local:8080/realms/rutas-realm/protocol/openid-connect/certs"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: grafo-service
  namespace: red-de-rutas
spec:
  selector:
    app: grafo-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
